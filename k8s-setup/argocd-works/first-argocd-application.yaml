apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: first-argocd-declarative-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/bunpanin/playaround-helms-argocd-repo
    targetRevision: HEAD
    path: plainting-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Manual sync
  syncPolicy:
    syncOptions:
      - Validate=false
  # Auto sync
  # syncPolicy:
  #   automated:
  #     prune: true
  #     selfHeal: true
  #   syncOptions:
  #     - Validate=false
 